    <script type="application/ld+json" id="ld-faq">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "¿Cómo funciona el proceso de cotización?", "acceptedAnswer": { "@type": "Answer", "text": "Es muy sencillo. Nos contactas por WhatsApp o llenas el formulario de cotización con los detalles de tu viaje (destino, fechas, número de personas y presupuesto). En menos de 2 horas, dentro de nuestro horario de atención (lunes a sábado, 9:00 AM – 6:00 PM), te enviamos una propuesta personalizada sin ningún costo." } },
        { "@type": "Question", "name": "¿Los paquetes incluyen vuelo y hotel?", "acceptedAnswer": { "@type": "Answer", "text": "Depende de cada paquete. Muchos incluyen vuelo redondo y hospedaje; otros incluyen solo hospedaje, tours o actividades (por ejemplo, los que indican “Vuelo no incluido”). Siempre especificamos claramente qué está incluido en cada paquete y en cada propuesta." } },
        { "@type": "Question", "name": "¿Cuánto tiempo de anticipación necesito para reservar?", "acceptedAnswer": { "@type": "Answer", "text": "Recomendamos reservar con al menos 4-6 semanas de anticipación para obtener los mejores precios. Sin embargo, también manejamos viajes de última hora y hacemos lo posible por conseguirte la mejor opción disponible." } },
        { "@type": "Question", "name": "¿Qué formas de pago aceptan?", "acceptedAnswer": { "@type": "Answer", "text": "Aceptamos transferencia bancaria, depósito, tarjeta de crédito/débito y pagos en efectivo. También ofrecemos planes de pago en mensualidades sin intereses para facilitar tu viaje." } },
        { "@type": "Question", "name": "¿Qué pasa si necesito cancelar o cambiar mi viaje?", "acceptedAnswer": { "@type": "Answer", "text": "Entendemos que los planes pueden cambiar. Tenemos políticas flexibles de cancelación y cambios. Te asesoramos sobre las mejores opciones según las políticas de aerolíneas y hoteles para minimizar cualquier penalización." } },
        { "@type": "Question", "name": "¿Trabajan solo con destinos en México?", "acceptedAnswer": { "@type": "Answer", "text": "Principalmente nos especializamos en destinos nacionales como Cancún, Puerto Vallarta, Los Cabos, Riviera Maya y Huatulco. Sin embargo, también podemos organizar viajes internacionales a destinos populares como Estados Unidos, Europa y el Caribe." } },
        { "@type": "Question", "name": "¿Ofrecen seguro de viaje?", "acceptedAnswer": { "@type": "Answer", "text": "Sí, recomendamos y podemos incluir seguro de viaje en todos nuestros paquetes. El seguro cubre emergencias médicas, cancelaciones y pérdida de equipaje. Es una inversión pequeña que te da mucha tranquilidad." } },
        { "@type": "Question", "name": "¿Tienen atención durante el viaje si surge algún problema?", "acceptedAnswer": { "@type": "Answer", "text": "¡Absolutamente! Nuestro servicio no termina cuando abordas el avión. Tenemos atención por WhatsApp las 24 horas durante tu viaje para resolver cualquier inconveniente que pueda surgir." } }
      ]
    }
